<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Poker</title>
  <link rel="stylesheet" href="poker.css">
</head>

<body>
  <a class="skip" href="#hand">Lewati ke kartu</a>
  <main id="app">
    <div class="board">
      <div class="pl" id="n"></div>
      <div class="pl" id="w"></div>
      <div id="c"></div>
      <div class="pl" id="e"></div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="hand" role="group" aria-label="Kartu di tanganmu"></div>
    <div class="btns">
      <button id="bPass" class="sec">Pass</button>
      <button id="bCek" class="sec">Ada yang lawan?</button>
    </div>
  </main>
  <div id="over" role="dialog" aria-modal="true" aria-label="Hasil ronde">
    <div class="box" id="ovb"></div>
  </div>
  <div id="revert" role="dialog" aria-modal="true" aria-labelledby="revertTitle">
    <div class="box">
      <h2 id="revertTitle">Pilih kombinasi lawan</h2>
      <p>Pilih permainan lawan yang ingin dikembalikan. Aksi setelah kombinasi itu juga akan diulang.</p>
      <div id="revertList" class="revert-list"></div>
      <div class="btns"><button id="cancelRevert" class="sec">Batal</button></div>
    </div>
  </div>
  <div id="playedCards" role="dialog" aria-modal="true" aria-labelledby="playedTitle">
    <div class="box">
      <h2 id="playedTitle">Kartu yang sudah keluar</h2>
      <p id="playedCount"></p>
      <div id="playedList" class="played-grid"></div>
      <div class="btns"><button id="closePlayed" class="sec">Tutup</button></div>
    </div>
  </div>
  <script src="js/core.js"></script>
  <script src="js/game.js"></script>
  <script src="js/history.js"></script>
  <script src="js/render.js"></script>
  <script src="js/interactions.js"></script>
</body>

</html>
